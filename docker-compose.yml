version: "3.9"

services:
  db:
    image: postgres:16
    container_name: code_docs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: code_docs
    ports:
      - "5432:5432"   # host:container
    volumes:
      - code_docs_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: repo_llm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  code_docs_data:
  redis_data:
